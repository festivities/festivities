                                        <div class="sha">#eee7bf7</div>
                                        <div class="message">store: slice 8.3b part B1, accounts, tokens and the ledger live in cherry.db

Memory stays the authority; SaveLocked(lines, accs...) writes the named account rows, their new token rows, the ledger lines and the meta scalars in one transaction. The clear-token map is replaced by an index keyed by SHA-256; tokens and guest codes are never stored in clear. In test builds a save panics when an account it did not name changed. cmd/cherry opens the database and refuses to start empty beside an accounts.json. Lab migrated with cherry-import and verified on both AVDs.

Co-Authored-By: Claude Fable 5.2 &lt;noreply@anthropic.com&gt;</div>
