                                        <div class="sha">#f7a46df</div>
                                        <div class="message">docs: revise .agents before the platform refactor; Roadmap 8 revised

Stale facts (checked read-only 2026-11-10):
- Lab is down since the 10:20 host reboot (no Cherry process, no listeners,
  AVDs Cherry and Jerry stopped); YunDetect PID; exe hash unchanged
- the Raspberry AVD exists and was emulator-5554: serial hazard noted in
  AGENTS, TESTING and the tester agent definition
- DATASET: object count, DiarySkin row, dependency and client-patch rules
- Code map: circle.json, no module dependency yet; cross-references to the
  sections moved in ceb1c5e
- handoff 2026-11-09 accepted with corrections; no open task started

Roadmap 8 (user decisions untouched; "Revision 2026-11-10" explains each):
- storage: memory stays authoritative, SQLite is the write-through record;
  saves name the accounts they changed, ledger in the same transaction
- load test with a target before any lock work
- operator documents apply at restart first, hot swap per document later
- first OCI deploy right after storage, on an allowlist
- security found in the code: newest-account fallbacks, clear-text tokens,
  unauthenticated diary upload, admin cookie vs ports, burst-aware limits,
  retention, gifts as a Gem transfer channel
- new P11 moderation and player content; Linux build in the gate from 8.3a
- AGENTS "Where the platform refactor starts": measured starting point

Co-Authored-By: Claude Fable 5.2 &lt;noreply@anthropic.com&gt;</div>
