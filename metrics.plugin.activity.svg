Garden, Square, Room Party, Circle and Treasure World logins and the TLUP ClientSession took the claimed aid on trust; a login is now accepted only when that account holds the presented session key (constant-time), and the connection's actor is fixed at login. Session and gateway frame caps before authentication, a per-address connection cap. Device-verified on both AVDs with the stock client.

